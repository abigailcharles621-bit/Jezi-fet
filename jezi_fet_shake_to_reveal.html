const prompt = document.getElementById('prompt');
const permission = document.getElementById('permission');
const enable = document.getElementById('enable');
const error = document.getElementById('error');

function reveal() {
  if (revealed) return;
  revealed = true;
  cover.style.display = 'none';
  cast.style.display = 'block';
  prompt.textContent = '✨ Cast revealed!';
  setTimeout(() => prompt.style.opacity = '0', 1400);
}

function handleMotion(e) {
  const a = e.accelerationIncludingGravity || e.acceleration;
  if (!a) return;
  const x = a.x || 0, y = a.y || 0, z = a.z || 0;
  const now = Date.now();
  if (now - last < 80) return;
  last = now;
  const force = Math.sqrt(x*x + y*y + z*z);
  if (force > 18) {
    score++;
    if (score >= 2) reveal();
  } else if (score > 0) {
    score--;
  }
}

async function enableMotion() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      const result = await DeviceMotionEvent.requestPermission();
      if (result !== 'granted') throw new Error('Motion access was not granted.');
    }
    window.addEventListener('devicemotion', handleMotion, true);
    permission.style.display = 'none';
    prompt.textContent = 'Shake your phone to reveal the cast 👀';
  } catch (err) {
    error.textContent = err.message || 'Motion access could not be enabled.';
    error.style.display = 'block';
  }
}

if (typeof DeviceMotionEvent !== 'undefined' &&
    typeof DeviceMotionEvent.requestPermission === 'function') {
  permission.style.display = 'flex';
} else {
  window.addEventListener('devicemotion', handleMotion, true);
}
enable.addEventListener('click', enableMotion);

// Tap fallback for computers/testing.
document.getElementById('app').addEventListener('click', () => {
  if (!revealed) reveal();
});
</script>
</body>
</html>
